server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- CreditLens AI's sidebar navigation is
    # client-side state, not routed URLs, but this keeps any
    # direct/deep link to a static asset path resolving sanely.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy browser calls to /api/... through to the backend,
    # stripping the /api prefix so GET /api/health reaches the
    # backend as GET /health. The trailing slashes on both the
    # location and proxy_pass are what make that stripping happen.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
